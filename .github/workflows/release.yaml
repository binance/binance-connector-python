name: Release Python Connector

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  detect-clients:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.detect.outputs.clients }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect clients to release
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Every releasable package in the repository
          ALL_CLIENTS=()

          if [ -d common ]; then
            ALL_CLIENTS+=("common")
          fi

          for client in clients/*; do
            if [ -d "$client" ]; then
              ALL_CLIENTS+=("$(basename "$client")")
            fi
          done

          build_all() {
            printf '%s\n' "${ALL_CLIENTS[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))'
          }

          BASE_SHA=""
          if [ "$EVENT_NAME" = "push" ] \
            && [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$BEFORE_SHA"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No usable diff base (event '$EVENT_NAME'): considering every client"
            CLIENTS_JSON=$(build_all)
          else
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$CURRENT_SHA")

            echo "Changed files:"
            echo "$CHANGED_FILES" | sed 's/^/  /'

            CLIENTS_JSON=$(echo "$CHANGED_FILES" | awk -F/ '
              $1 == "common"  { print "common" }
              $1 == "clients" && NF > 2 { print $2 }
            ' | jq -R -s -c 'split("\n") | map(select(. != "")) | unique')
          fi

          echo "Clients to release: $CLIENTS_JSON"
          echo "clients=$CLIENTS_JSON" >> "$GITHUB_OUTPUT"

  release:
    needs: detect-clients
    if: ${{ needs.detect-clients.outputs.clients != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        client: ${{ fromJson(needs.detect-clients.outputs.clients) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare versions
        id: version
        run: |
          if [ "${{ matrix.client }}" == "common" ]; then
            cd common
            old_version=$(git show HEAD^:${{ matrix.client }}/pyproject.toml | grep '^version' | head -1 | sed -E 's/version = "(.*)"/\1/')
          else
            cd clients/${{ matrix.client }}
            old_version=$(git show HEAD^:clients/${{ matrix.client }}/pyproject.toml | grep '^version' | head -1 | sed -E 's/version = "(.*)"/\1/')
          fi

          new_version=$(grep '^version' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')

          if [ "$old_version" = "$new_version" ]; then
            echo "release_needed=false" >> $GITHUB_OUTPUT
          else
            echo "release_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set working directory path
        if: steps.version.outputs.release_needed == 'true'
        id: path
        run: echo "dir=$([[ '${{ matrix.client }}' == 'common' ]] && echo 'common' || echo 'clients/${{ matrix.client }}')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.version.outputs.release_needed == 'true'
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        if: steps.version.outputs.release_needed == 'true'
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          poetry install
          if [ "${{ matrix.client }}" == "common" ]; then
            poetry config pypi-token.pypi ${{ secrets.PYPI_COMMON_TOKEN }}
          else
            poetry config pypi-token.pypi ${{ secrets.PYPI_CLIENTS_TOKEN }}
          fi

      - name: Build (release)
        if: steps.version.outputs.release_needed == 'true'
        working-directory: ${{ steps.path.outputs.dir }}
        run: poetry build

      - name: Publish to pypi
        if: steps.version.outputs.release_needed == 'true'
        working-directory: ${{ steps.path.outputs.dir }}
        run: poetry publish
