[tool.poetry]
name = "binance-sdk-sub-account"
version = "8.7.0"
description = "Official Binance SubAccount SDK - A lightweight library that provides a convenient interface to Binance's SubAccount REST API"
authors = ["Binance"]
license = "MIT"
readme = "README.md"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/binance_sdk_sub_account/py.typed"]
packages = [
  { include = "binance_sdk_sub_account", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
requests = ">=2.34.2"
urllib3 = ">=2.8.0"
pydantic = ">=2.14.1"
pycryptodome = ">=3.17,<5"
aiohttp = "^3.14.5"
binance-common = "4.8.0"

[tool.poetry.group.dev.dependencies]
tox = "^4.67.4"
virtualenv = ">=21.15.1"
filelock = ">=4.2.4"
pytest-asyncio = "^1.4.1"
black = "^26.10.1"
ruff = "^0.17.3"
pytest = ">=9.2.0"

[tool.ruff]
exclude = [".git", ".tox", "build", "dist"]
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E741"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
