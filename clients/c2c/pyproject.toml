[tool.poetry]
name = "binance-sdk-c2c"
version = "5.7.0"
description = "Official Binance C2C SDK - A lightweight library that provides a convenient interface to Binance's C2C REST API"
authors = ["Binance"]
license = "MIT"
readme = "README.md"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/binance_sdk_c2c/py.typed"]
packages = [
  { include = "binance_sdk_c2c", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = ">=2.34.2"
urllib3 = ">=2.8.0"
pydantic = ">=2.14.1"
pycryptodome = ">=3.17,<5"
aiohttp = "^3.14.5"
binance-common = "4.7.0"

[tool.poetry.group.dev.dependencies]
tox = "^4.65.0"
virtualenv = ">=21.14.9"
pytest-asyncio = "^1.4.0"
black = "^26.10.1"
ruff = "^0.17.0"
pytest = ">=9.1.1"

[tool.ruff]
exclude = [".git", ".tox", "build", "dist"]
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E741"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
