[tool.poetry]
name = "binance-common"
version = "4.7.1"
description = "Binance Common Types and Utilities for Binance Connectors"
authors = ["Binance"]
license = "MIT"
readme = "README.md"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/binance_common/py.typed"]
packages = [
  { include = "binance_common", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = ">=2.34.2"
urllib3 = ">=2.8.0"
certifi = ">=2026.10.19"
pydantic = ">=2.14.1"
pycryptodome = ">=3.17,<5"
aiohttp = "^3.14.5"

[tool.poetry.group.dev.dependencies]
tox = "^4.65.0"
virtualenv = ">=21.14.9"
filelock = [
  { version = ">=4.2.1", python = ">=3.11" },
  { version = ">=3.25", python = "<3.11" },
]
pytest-asyncio = "^1.4.0"
black = "^26.10.1"
ruff = "^0.17.0"
pytest = ">=9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [".git", ".tox", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.flake8]
max-line-length = 100
