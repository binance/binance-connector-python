[tool.poetry]
name = "binance-common"
version = "4.8.0"
description = "Binance Common Types and Utilities for Binance Connectors"
authors = ["Binance"]
license = "MIT"
readme = "README.md"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/binance_common/py.typed"]
packages = [
  { include = "binance_common", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
requests = ">=2.34.2"
urllib3 = ">=2.8.0"
certifi = ">=2026.10.23"
pydantic = ">=2.14.1"
pycryptodome = ">=3.17,<5"
aiohttp = "^3.14.5"

[tool.poetry.group.dev.dependencies]
tox = "^4.67.4"
virtualenv = ">=21.15.1"
filelock = ">=4.2.4"
pytest-asyncio = "^1.4.1"
black = "^26.10.1"
ruff = "^0.17.3"
pytest = ">=9.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [".git", ".tox", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.flake8]
max-line-length = 100
